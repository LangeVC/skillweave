name: SDK Contract CI

# Das SDK besitzt die autoritative Wertemenge. Dieser Job stellt zwei Dinge
# sicher, damit das SDK NICHT selbst zur zweiten Wahrheit wird:
#   1. Jedes Kern-Schema parst als gueltiges JSON.
#   2. Die maschinenlesbare Contract-Datei (contract/*.enum.json) ist aus dem
#      Schema erzeugt — wird sie von Hand geaendert, weicht sie ab, und dieser
#      Job wird rot. Der Waechter des Consumers haengt an genau dieser Datei.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-consistency:
    name: Schemas + Contract-Auszug konsistent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validierung Schema <-> Contract-enum
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          # 1. Schemas sind gueltiges JSON.
          for schema in Path("schemas").glob("*.schema.json"):
              json.loads(schema.read_text(encoding="utf-8"))
              print(f"  OK schema: {schema}")

          # 2. contract/run-state.enum.json entspricht dem Schema-enum.
          schema = json.loads(Path("schemas/run-state.schema.json").read_text())
          from_schema = set(schema["properties"]["state"]["enum"])
          contract = json.loads(Path("contract/run-state.enum.json").read_text())
          from_contract = set(contract["values"])
          assert contract["schema_version"] == "1.0.0", contract["schema_version"]
          if from_schema != from_contract:
              only_schema = from_schema - from_contract
              only_contract = from_contract - from_schema
              raise SystemExit(
                  f"Drift im SDK selbst: schema-only={sorted(only_schema)}, "
                  f"contract-only={sorted(only_contract)}"
              )
          print(f"  OK contract: run-state.enum.json ({len(from_contract)} Werte)")
          print("PASS: SDK besitzt EINE Wertemenge.")
          PY
