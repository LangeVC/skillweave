# SkillWeave Bundle Variants
# Predefined bundles that compose lifecycle phases into common workflows.

bundles:
  - id: full-lifecycle
    name: "Full Lifecycle"
    description: "Complete end-to-end workflow from idea to production and beyond"
    phases:
      - discovery
      - blueprint
      - design
      - build
      - release
      - launch
      - post-release
    entry_requires:
      - "A project idea or problem statement (any fidelity)"
    recommended_for:
      - "New projects starting from scratch"
      - "Strategic initiatives requiring full process"
    estimated_effort: "Full project duration"
    parallel_phases: []
    notes: "All phases are available; skipping is always allowed"

  - id: discovery-to-blueprint
    name: "Discovery to Blueprint"
    description: "Research and planning phase — ideal for validating ideas before committing to build"
    phases:
      - discovery
      - blueprint
    entry_requires:
      - "A problem or opportunity to explore"
    recommended_for:
      - "Early-stage product validation"
      - "Feature discovery sprints"
      - "Research-heavy initiatives"
    estimated_effort: "1-3 days"
    parallel_phases: []
    notes: "Output is a validated PRD ready for execution"

  - id: design-and-build
    name: "Design and Build"
    description: "Implementation-focused bundle — skip discovery and blueprint, go straight to building"
    phases:
      - design
      - build
    entry_requires:
      - "Valid PRD or clear requirements exist"
      - "Architecture decisions are made"
    recommended_for:
      - "Well-understood features with existing requirements"
      - "Bug fixes and incremental improvements"
      - "Implementation of pre-approved designs"
    estimated_effort: "2-5 days"
    parallel_phases:
      - design
      - build
    notes: "Design and build can run in parallel for independent components"

  - id: release-and-launch
    name: "Release and Launch"
    description: "Ship-focused bundle — for taking completed work to production"
    phases:
      - release
      - launch
    entry_requires:
      - "Working code in a releasable state"
      - "Tests pass"
    recommended_for:
      - "Shipping completed features"
      - "Patch releases and hotfixes"
      - "End-of-sprint release cycles"
    estimated_effort: "1-2 days"
    parallel_phases: []
    notes: "Release must complete before launch begins"

  - id: post-release-improvement
    name: "Post-Release Improvement"
    description: "Learning and iteration bundle — for production systems needing refinement"
    phases:
      - post-release
      - blueprint
      - build
    entry_requires:
      - "System is live in production"
      - "Feedback or metrics are available"
    recommended_for:
      - "Post-launch iteration cycles"
      - "Performance optimization"
      - "User feedback implementation"
    estimated_effort: "2-5 days"
    parallel_phases: []
    notes: "Re-enters at blueprint for planning improvements, then build for implementation"

# Custom bundle composition
custom_composition:
  allowed: true
  pattern: "Select any subset of phases in order. Phases execute sequentially."
  max_phases: 7
  min_phases: 1
