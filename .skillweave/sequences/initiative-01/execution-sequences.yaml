metadata:
  sequence_id: seq-01-process-architecture
  version: 1.0.0
  initiative: "01 — Process Architecture and Bundle System"
  created: 2026-04-27
  sequence_type: build
  execution_mode: ralph_attended
  complexity_score: 55
  workflow: ralph-loop-attended
  checkpoint_interval: 4

objective:
  goal: "Define a 7-phase lifecycle model, modular bundle system, entry point detection, and workflow recommendation engine"
  success: "Phase definitions, bundle configurations, detection logic, and recommendation engine are implemented and tested"

success_criteria:
  - "7 lifecycle phases defined in .skillweave/lifecycle/phases.yaml with entry/exit conditions"
  - "5 bundle variants defined in .skillweave/lifecycle/bundles.yaml"
  - "Entry point detection script correctly identifies stage for empty, PRD-only, and code-only projects"
  - "Recommendation engine returns valid recommendations for all entry points"
  - "All existing tests pass (backward compatible)"
  - "Onboarding flow completes with stage detection and bundle recommendation"

assumptions:
  - "Current SkillWeave skill interfaces remain stable"
  - "7-phase model covers all practical use cases"
  - "Phase system is opt-in, not mandatory"

usage_notes:
  execute_from: ".skillweave/lifecycle/"
  inputs_required: "Current project state (files present, config)"
  parallel_strategy: "ARCH tasks first, then parallel FEAT tasks, then INTG"

inputs_required:
  - name: project_root
    description: "Path to SkillWeave project root"
    default: "."
  - name: existing_config
    description: "Current .skillweave/config.yaml"

outputs_required:
  - name: lifecycle_phases
    path: ".skillweave/lifecycle/phases.yaml"
    format: yaml
  - name: bundle_definitions
    path: ".skillweave/lifecycle/bundles.yaml"
    format: yaml
  - name: detection_module
    path: "skillweave/phase_detection.py"
    format: python
  - name: recommendation_module
    path: "skillweave/workflow_recommendation.py"
    format: python
  - name: test_results
    format: test-run

sequence_steps:
  - phase: "initialization"
    steps:
      - id: "ARCH-001"
        title: "Define lifecycle phase registry schema"
        description: "Create .skillweave/lifecycle/phases.yaml with all 7 phases: discovery, blueprint, design, build, release, launch, post-release. Each phase has id, name, order, entry_conditions, exit_conditions, skills, and capabilities."
        type: documentation
        estimated_minutes: 30
        priority: critical
        depends_on: []
        gates:
          - "YAML validates against schema"
          - "7 phases present with all required fields"
          - "Phase order is sequential (1-7)"
          - "Cross-validate with Initiative 02-03 phase boundaries"

      - id: "ARCH-002"
        title: "Define bundle variant configurations"
        description: "Create .skillweave/lifecycle/bundles.yaml with 5 predefined bundles: full-lifecycle, discovery-to-blueprint, design-and-build, release-and-launch, post-release-improvement. Each specifies phases, entry_requires, recommended_for, estimated_effort."
        type: documentation
        estimated_minutes: 30
        priority: critical
        depends_on: ["ARCH-001"]
        gates:
          - "YAML validates against schema"
          - "5 bundles present with phase references"
          - "All phase references point to valid IDs from phases.yaml"
          - "Entry requirements are testable"

  - phase: "core-development"
    parallel: true
    steps:
      - id: "FEAT-001"
        title: "Implement entry point detection logic"
        description: "Build skillweave/phase_detection.py that analyzes project artifacts to determine lifecycle stage. Checks for: PRD, source code, tests, deployment config, release notes. Returns stage ID and confidence score (0-1)."
        type: infrastructure
        estimated_minutes: 60
        priority: high
        depends_on: ["ARCH-001"]
        gates:
          - "Detection on empty project returns 'discovery' with high confidence"
          - "Detection on project with PRD only returns correct stage"
          - "Detection on project with code+tests returns correct stage"
          - "Confidence score is between 0 and 1"
          - "Fallback to interactive if confidence < 0.5"

      - id: "FEAT-002"
        title: "Implement workflow recommendation engine"
        description: "Build skillweave/workflow_recommendation.py that takes detected_stage and goal, returns recommended_bundle, next_action, gap_analysis. Integrates with existing intelligent detection."
        type: infrastructure
        estimated_minutes: 60
        priority: high
        depends_on: ["ARCH-002", "FEAT-001"]
        gates:
          - "Stage + 'build an app' → recommends full-lifecycle"
          - "Stage + 'ship it' with missing prerequisites → recommends with gap warning"
          - "Stage + 'finish feature' → recommends design-and-build"
          - "Unknown stage → triggers onboarding flow"
          - "Integrates with integrate_with_skill() without breaking it"

  - phase: "onboarding-implementation"
    parallel: false
    steps:
      - id: "FEAT-003"
        title: "Implement phase-aware onboarding flow"
        description: "Interactive onboarding that guides users through stage identification, bundle selection, first-step recommendation. State persists in .skillweave/onboarding-state.yaml."
        type: infrastructure
        estimated_minutes: 45
        priority: medium
        depends_on: ["FEAT-002"]
        gates:
          - "Asks about current stage, artifacts, and goal"
          - "Recommends bundle and starting skill"
          - "State persists across sessions"
          - "Skippable with --skip-onboarding flag"

      - id: "FEAT-004"
        title: "Implement phase boundary enforcement"
        description: "Skills can declare phase membership. Out-of-phase invocation triggers recommendation (not hard block). Override available. Violations logged to .skillweave/tracking-log/."
        type: infrastructure
        estimated_minutes: 45
        priority: medium
        depends_on: ["ARCH-001", "FEAT-001"]
        gates:
          - "Release skill on project without code → recommendation (not crash)"
          - "Override flag proceeds despite phase mismatch"
          - "Phase violations logged with timestamp"

  - phase: "integration"
    parallel: false
    steps:
      - id: "INTG-001"
        title: "Integrate phase system with existing skill infrastructure"
        description: "Connect phase registry, bundle system, and recommendation engine with existing intelligent detection. Extend config.yaml with active_bundle and current_phase."
        type: integration
        estimated_minutes: 60
        priority: high
        depends_on: ["FEAT-001", "FEAT-002", "FEAT-003", "FEAT-004"]
        gates:
          - "integrate_with_skill() uses phase detection when available"
          - "Config.yaml supports active_bundle and current_phase"
          - "Existing skill invocations work unchanged"
          - "Phase system is opt-in — no impact when not configured"

  - phase: "testing"
    parallel: false
    steps:
      - id: "TEST-001"
        title: "Create test suite for lifecycle and bundle system"
        description: "15+ test cases covering phase registry, bundle composition, entry detection, recommendation engine, onboarding, phase enforcement, backward compatibility."
        type: testing
        estimated_minutes: 45
        priority: high
        depends_on: ["INTG-001"]
        gates:
          - "15+ test cases exist"
          - "All tests pass"
          - "Backward compatibility tests pass"
          - "Coverage of core scenarios"

final_assembly:
  steps:
    - "Merge .skillweave/lifecycle/ directory into project"
    - "Update .skillweave/config.yaml with lifecycle references"
    - "Update skill metadata files with phase membership"
    - "Run full test suite to confirm backward compatibility"
    - "Generate phase-system summary for documentation"

validation_rules:
  - "All YAML files must validate against schema"
  - "Phase references in bundles must point to valid phase IDs"
  - "Detection module must not crash on any project state"
  - "All existing tests must pass (backward compat critical)"
  - "Phase system must be skippable"

failure_handling:
  detection_failure:
    action: "Fall back to interactive stage selection"
    max_retries: 2
  recommendation_failure:
    action: "Return generic full-lifecycle recommendation"
    max_retries: 1
  validation_failure:
    action: "Log error and report issues without blocking"
    max_retries: 0
