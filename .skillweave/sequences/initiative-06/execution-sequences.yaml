metadata:
  sequence_id: seq-06-github-integration
  version: 1.0.0
  initiative: "06 — GitHub Action, GitHub App, and Integration Layer"
  created: 2026-04-27
  sequence_type: build
  execution_mode: ralph_attended
  complexity_score: 62
  workflow: ralph-loop-attended
  checkpoint_interval: 3

objective:
  goal: "Create Bundle Validation and Release Readiness GitHub Actions in separate repositories, implement trust signal generation, and assess GitHub App feasibility"
  success: "Both Actions operational in their own repos, validated against SkillWeave bundle structure, distribution-ready with version tags"

success_criteria:
  - "Bundle Validation Action validates skill directory structure, SKILL.md, capability.yaml, and internal references"
  - "Release Readiness Action checks version bump, CHANGELOG, tests, required files, WIP markers"
  - "Both Actions produce structured JSON output with per-check results"
  - "Trust signals (badge, release assets, attestation-ready format) implemented"
  - "GitHub App feasibility assessment completed with recommendation"
  - "Both Actions tagged v1.0.0 with major version pinning"
  - "No Action code exists in core SkillWeave repository"

assumptions:
  - "SkillWeave bundle structure remains stable across releases"
  - "Separate repos for each Action is the correct architecture"
  - "GitHub ubuntu-latest runners are the target environment"

usage_notes:
  execute_from: "Separate GitHub repositories (created during INFRA steps)"
  inputs_required: "Action specifications from DESIGN-001; SkillWeave repo as test target"
  parallel_strategy: "Tracks A and B in parallel (INFRA-001/FEAT-001 || INFRA-002/FEAT-002); then FEAT-003, DOC-001, TEST-001 batch"

inputs_required:
  - name: skillweave_repo_path
    description: "Path to SkillWeave repository for testing Actions"
    default: "../SkillWeave"
  - name: github_token
    description: "GitHub token for creating repos, releases, and tags"
    sensitive: true

outputs_required:
  - name: validate_action_repo
    path: "skillweave-action-validate/"
    format: "GitHub repository"
  - name: release_check_action_repo
    path: "skillweave-action-release-check/"
    format: "GitHub repository"
  - name: app_assessment
    path: ".skillweave/prds/initiative-06/github-app-assessment.md"
    format: markdown
  - name: test_results
    format: test-run

sequence_steps:
  - phase: "design"
    parallel: false
    steps:
      - id: "DESIGN-001"
        title: "Define Action specifications and output format"
        description: "Specify validation checks, release readiness checks, input parameters, and standardized JSON/Markdown output format for both Actions."
        type: documentation
        estimated_minutes: 45
        priority: critical
        depends_on: []
        gates:
          - "Validation checks list defined (structure, metadata, manifest, docs)"
          - "Release readiness checks list defined (version, changelog, tests, files)"
          - "Input parameters specified for both Actions"
          - "Output format defined: JSON with checks[], summary, pass/fail counts"
          - "GitHub annotations format defined (error/warning)"

  - phase: "infra-track-a"
    parallel: false
    steps:
      - id: "INFRA-001"
        title: "Set up skillweave-action-validate repository"
        description: "Create separate repository for Bundle Validation Action with action.yml, src/, dist/, README, and CI workflow."
        type: infrastructure
        estimated_minutes: 30
        priority: critical
        depends_on: ["DESIGN-001"]
        gates:
          - "Repository structure: action.yml, src/, dist/, README.md"
          - "action.yml has inputs: path, strictness"
          - "README has usage examples"
          - "CI workflow validates the Action itself"
          - "Semantic versioning configured"

      - id: "FEAT-001"
        title: "Implement bundle validation logic"
        description: "Core validation: skill directory structure, SKILL.md presence, capability.yaml schema, required fields, manifest consistency, no broken internal references."
        type: infrastructure
        estimated_minutes: 90
        priority: critical
        depends_on: ["INFRA-001"]
        gates:
          - "Validates skill directory structure"
          - "Checks SKILL.md presence per skill"
          - "Validates capability.yaml against schema"
          - "Checks required fields in skill metadata"
          - "Detects broken internal references"
          - "Produces structured JSON output with per-check results"
          - "Configurable strictness (lenient, standard, strict)"

  - phase: "infra-track-b"
    parallel: false
    steps:
      - id: "INFRA-002"
        title: "Set up skillweave-action-release-check repository"
        description: "Create separate repository for Release Readiness Action with action.yml, src/, dist/, README, and CI workflow."
        type: infrastructure
        estimated_minutes: 30
        priority: critical
        depends_on: ["DESIGN-001"]
        gates:
          - "Repository structure: action.yml, src/, dist/, README.md"
          - "action.yml has inputs: require_changelog, require_version_bump, require_tests"
          - "README has usage examples"
          - "CI workflow validates the Action itself"
          - "Semantic versioning configured"

      - id: "FEAT-002"
        title: "Implement release readiness check logic"
        description: "Check version bump, CHANGELOG updated, tests passing, required files present, no WIP markers. Produce readiness report."
        type: infrastructure
        estimated_minutes: 75
        priority: critical
        depends_on: ["INFRA-002"]
        gates:
          - "Checks version bump (compares to previous release)"
          - "Checks CHANGELOG has entry for new version"
          - "Checks test suite exists and passes"
          - "Checks required files present (configurable list)"
          - "Detects WIP/draft markers in release candidate"
          - "Produces readiness report (JSON + Markdown)"
          - "Can block PR merge as status check"

  - phase: "trust-and-assessment"
    parallel: true
    steps:
      - id: "FEAT-003"
        title: "Implement trust signal generation"
        description: "Generate validation badge for README, store validation results as release assets, create attestation-ready output format."
        type: infrastructure
        estimated_minutes: 45
        priority: medium
        depends_on: ["FEAT-001", "FEAT-002"]
        gates:
          - "Validation badge generatable (shields.io compatible)"
          - "Validation results stored as GitHub release asset"
          - "Validation history trackable across releases"
          - "Output format supports future supply chain signing"
          - "Badge URL documented in README"

      - id: "DOC-001"
        title: "GitHub App feasibility assessment"
        description: "Assess whether a GitHub App adds value beyond Actions. Evaluate: repo sync, release signal capture, trust enrichment, discovery support. Recommend proceed/defer/skip."
        type: documentation
        estimated_minutes: 60
        priority: medium
        depends_on: ["FEAT-001", "FEAT-002"]
        gates:
          - "Assessment covers 4 use cases: repo sync, release signals, trust, discovery"
          - "Build cost and maintenance burden evaluated"
          - "User value assessed per use case"
          - "Clear recommendation: proceed / defer / skip with rationale"
          - "If proceed: MVP scope defined"
          - "Assessment saved to .skillweave/prds/initiative-06/github-app-assessment.md"

  - phase: "testing"
    parallel: false
    steps:
      - id: "TEST-001"
        title: "Test Actions on SkillWeave repository"
        description: "Run both Actions against the SkillWeave repo. Validate output format, check accuracy, verify no false positives."
        type: testing
        estimated_minutes: 45
        priority: high
        depends_on: ["FEAT-001", "FEAT-002"]
        gates:
          - "Validation Action runs on SkillWeave repo without errors"
          - "Release Readiness Action runs and produces correct assessment"
          - "No false positives on known-good structure"
          - "False negatives detected on intentionally broken structure"
          - "Output JSON validates against defined schema"
          - "Markdown output is human-readable"

  - phase: "distribution"
    parallel: false
    steps:
      - id: "DIST-001"
        title: "Prepare Actions for distribution"
        description: "Version tag both Actions, prepare for GitHub Marketplace (or direct reference), document version pinning."
        type: infrastructure
        estimated_minutes: 30
        priority: medium
        depends_on: ["TEST-001"]
        gates:
          - "Both Actions tagged with v1.0.0"
          - "Major version tag (v1) created for version pinning"
          - "dist/ folder built and committed"
          - "Marketplace listing prepared (or direct-reference README)"
          - "Usage examples in both READMEs"

final_assembly:
  steps:
    - "Verify both Action repositories exist and are publicly accessible"
    - "Confirm Action references work via uses: anomalyco/skillweave-action-validate@v1"
    - "Confirm Action references work via uses: anomalyco/skillweave-action-release-check@v1"
    - "Run both Actions against SkillWeave repo via workflow_dispatch"
    - "Generate final execution report with badge status and assessment conclusion"

validation_rules:
  - "Actions must run on ubuntu-latest"
  - "No proprietary dependencies"
  - "Core SkillWeave repo must not contain Action code"
  - "Actions must complete in < 60 seconds"
  - "Validation must have no false positives on known-good bundles"
  - "Configurable strictness levels must work (lenient, standard, strict)"
  - "Release readiness must not block on optional checks"

failure_handling:
  design_rejection:
    action: "Return to DESIGN-001 with rejection notes, adjust spec"
    max_retries: 2
  action_creation_failure:
    action: "Re-attempt repo creation with alternate name, report GitHub API issues"
    max_retries: 2
  validation_logic_failure:
    action: "Fix specific check with failing test case, run Ralph Loop iteration"
    max_retries: 3
  test_failure:
    action: "Log false positive/negative details, fix validation logic, re-run tests"
    max_retries: 3
