metadata:
  sequence_id: seq-05-execution-system
  version: 1.0.0
  initiative: "05 — Execution System, Checklists, Memory, and Observability"
  created: 2026-04-27
  sequence_type: build
  execution_mode: ralph_overnight
  complexity_score: 72
  workflow: ralph-loop-overnight
  checkpoint_interval: 6

objective:
  goal: "Build checklist-driven execution loop, persistent project memory, context compaction, selective loading, artifact tracking, correction by regeneration, and execution observability"
  success: "All 7 features implemented and tested, execution loop completes sample checklist with metrics recorded"

success_criteria:
  - "Checklist loop reads markdown, identifies next unchecked item, executes, updates status, and loops"
  - "Memory layer stores and retrieves entries across 5 categories as YAML in .skillweave/memory/"
  - "Context compaction produces structured 4-section summary after each step"
  - "Metrics tracked per step: step_id, tokens_used, runtime_seconds, success, retries"
  - "Selective loader reads only declared context, defaults to memory + checklist + last summary"
  - "Decision, learning, and task logs exist as append-only YAML with timestamp and rationale"
  - "Failed steps retry from last good context, max retries configurable, human review after exhaustion"
  - "Integration with existing skills is opt-in and backward compatible"
  - "18+ test cases pass covering all features"

assumptions:
  - "YAML-based file persistence is sufficient for project memory at launch scale"
  - "Markdown checklist format is expressive enough for all planned execution patterns"
  - "Execution system can be gradually adopted without breaking existing workflows"
  - "Agent frameworks can read/write YAML and Markdown files natively"

usage_notes:
  execute_from: ".skillweave/"
  inputs_required: "Config YAML, existing skill metadata, project root"
  parallel_strategy: "PHASE 1 serial, PHASE 2-3 parallel groups, PHASE 4 advanced after deps, PHASE 5-6 serial"
  autonomous_mode: true
  human_escalation: "After max retries exhausted on any step"
  checkpoints_autonomous: true

inputs_required:
  - name: project_root
    description: "Path to SkillWeave project root"
    default: "."
  - name: config_yaml
    description: "Current .skillweave/config.yaml"
  - name: existing_skills
    description: "Existing skill metadata files for INTG-001"

outputs_required:
  - name: directory_structure
    path: ".skillweave/memory/, .skillweave/checklists/, .skillweave/tracking-log/"
    format: directory
  - name: checklist_engine
    path: "skillweave/checklist_loop.py"
    format: python
  - name: memory_layer
    path: "skillweave/memory.py"
    format: python
  - name: compaction_engine
    path: "skillweave/compaction.py"
    format: python
  - name: observability_module
    path: "skillweave/observability.py"
    format: python
  - name: selective_loader
    path: "skillweave/context_loader.py"
    format: python
  - name: artifact_tracker
    path: "skillweave/artifact_tracker.py"
    format: python
  - name: correction_module
    path: "skillweave/correction.py"
    format: python
  - name: integration_module
    path: "skillweave/execution_integration.py"
    format: python
  - name: test_suite
    path: "tests/test_execution_system.py"
    format: python

sequence_steps:
  - phase: "design"
    parallel: false
    autonomous: true
    steps:
      - id: "DESIGN-001"
        title: "Define execution directory structure and format specifications"
        description: "Define the .skillweave/ directory layout for memory, checklists, tracking-log, and config. Specify YAML formats for all new file types: memory files, task-log, decisions, learnings, metrics. Document checklist format (markdown with extensions) and context summary format."
        type: documentation
        estimated_minutes: 30
        priority: critical
        depends_on: []
        gates:
          - "Directory structure documented: memory/, checklists/, tracking-log/"
          - "YAML format defined for: memory files, task-log, decisions, learnings, metrics"
          - "Checklist format documented (markdown with - [ ] and - [x] syntax, nesting support)"
          - "Context summary format defined with 4 sections: completed_items, key_decisions, current_state, next_steps"
          - "All formats are agent-agnostic (plain YAML/Markdown)"
        autonomous_check:
          validate: "Verify directory tree matches spec and YAML schemas are self-consistent"
          on_failure: "Revise format specs and re-validate"

  - phase: "core-checklist"
    parallel: true
    autonomous: true
    steps:
      - id: "FEAT-001"
        title: "Implement checklist loop engine"
        description: "Core execution loop: read markdown checklist -> identify next unchecked item -> execute -> update status -> loop. Supports nested checklists and blocker detection."
        type: infrastructure
        estimated_minutes: 75
        priority: critical
        depends_on: ["DESIGN-001"]
        gates:
          - "Reads markdown checklist files with - [ ] and - [x] syntax"
          - "Identifies next unchecked item in sequence (depth-first)"
          - "Updates checklist file with completion status after execution"
          - "Loops until all items checked or blocker encountered"
          - "Supports nested checklists (sub-items under items with indentation)"
          - "Blocker detection pauses loop and reports issue with reason"
        autonomous_check:
          validate: "Run checklist loop on sample checklist with 5 items, 2 sub-items, 1 blocker"
          on_failure: "Dump checklist state, retry from last valid parse, max 3 retries"

      - id: "FEAT-002"
        title: "Implement project memory layer"
        description: "Persistent key-value store in .skillweave/memory/ with categories: rules, decisions, conventions, architecture, open-issues. Readable and writable at runtime."
        type: infrastructure
        estimated_minutes: 60
        priority: critical
        depends_on: ["DESIGN-001"]
        gates:
          - "Memory stored as YAML files in .skillweave/memory/ with 5 category files"
          - "Read operation loads memory at skill startup, returns dict of all categories"
          - "Write operation appends entries during execution with timestamp"
          - "Memory portable across agent frameworks (plain YAML files)"
          - "Search by key or category works (filtered read)"
          - "Entry format: timestamp, content, source, tags"
        autonomous_check:
          validate: "Write 3 entries across 2 categories, read all, read filtered by category, verify file persistence"
          on_failure: "Fall back to single-file memory store, log error, retry once"

  - phase: "compaction-observability"
    parallel: true
    autonomous: true
    steps:
      - id: "FEAT-003"
        title: "Implement context compaction engine"
        description: "After each major step, produce compact summary: completed_items, key_decisions, current_state, next_steps. Save to tracking-log, loadable as starting context for next step."
        type: infrastructure
        estimated_minutes: 45
        priority: high
        depends_on: ["DESIGN-001"]
        gates:
          - "Compaction runs after each checklist item completion"
          - "Produces structured summary with 4 sections: completed_items, key_decisions, current_state, next_steps"
          - "Summary saved to .skillweave/tracking-log/context-summary.yaml"
          - "Summary loadable by next execution step"
          - "Original detailed output preserved separately in tracking log"
        autonomous_check:
          validate: "Compaction round-trip: produce summary, load it, verify 4 sections present"
          on_failure: "Fall back to minimal summary (current_state + next_steps only), continue"

      - id: "FEAT-004"
        title: "Implement execution observability"
        description: "Track per-step metrics: step_id, tokens_used, runtime_seconds, success/failure, retries. Generate summary report after execution."
        type: infrastructure
        estimated_minutes: 45
        priority: high
        depends_on: ["DESIGN-001"]
        gates:
          - "Metrics recorded per step in .skillweave/tracking-log/metrics.yaml"
          - "Tracks: step_id, tokens_used, runtime_seconds, success, retries"
          - "Summary report generated after execution completes"
          - "Cumulative metrics across sessions supported (append mode)"
          - "Report saved to .skillweave/tracking-log/execution-report.md"
        autonomous_check:
          validate: "Record 3 mock steps, generate report, verify all fields present"
          on_failure: "Write metrics as simple CSV fallback, continue"

      - id: "FEAT-006"
        title: "Implement artifact-first progress tracking"
        description: "Decision log, learning log, and task log as append-only YAML files. All progress written to files instead of remaining in chat."
        type: infrastructure
        estimated_minutes: 30
        priority: medium
        depends_on: ["DESIGN-001"]
        gates:
          - "Decision log at .skillweave/tracking-log/decisions.yaml"
          - "Learning log at .skillweave/tracking-log/learnings.yaml"
          - "Task log at .skillweave/tracking-log/task-log.yaml"
          - "Each entry has timestamp, context, and rationale"
          - "Logs are append-only (read + write pattern)"
        autonomous_check:
          validate: "Append to each log, verify entries persisted with timestamps"
          on_failure: "Log to a single combined file as fallback"

  - phase: "advanced-features"
    parallel: false
    autonomous: true
    steps:
      - id: "FEAT-005"
        title: "Implement selective context loader"
        description: "Load only files and sections needed for current step. Each checklist item can declare required_context. Default context: memory + current checklist + last summary."
        type: infrastructure
        estimated_minutes: 45
        priority: high
        depends_on: ["FEAT-002", "FEAT-003"]
        gates:
          - "Checklist items can declare required_context (file paths, sections) via frontmatter"
          - "Loader reads only declared context files"
          - "Default context includes: memory, checklist, last context summary"
          - "Overridable with explicit context specification"
          - "Measurably less context than full-load approach (file-size comparison)"
        autonomous_check:
          validate: "Define context spec with 2 files, verify loader reads only those files, compare byte count vs full load"
          on_failure: "Fall back to default context (memory + checklist + last summary), continue"

      - id: "FEAT-007"
        title: "Implement correction by regeneration"
        description: "When a step fails, retry from clean state using last good context summary. Track retry count, max retries configurable, human review after max retries."
        type: infrastructure
        estimated_minutes: 30
        priority: medium
        depends_on: ["FEAT-001", "FEAT-003"]
        gates:
          - "Failed steps marked in checklist with failure reason"
          - "Retry creates fresh context from last good summary"
          - "Retry count tracked per item in metrics"
          - "Max retries configurable (default: 3)"
          - "After max retries, item flagged for human review"
        autonomous_check:
          validate: "Simulate failure, verify retry trigger, verify max-retries escalation"
          on_failure: "Flag for human review immediately, do not infinite-loop"

  - phase: "integration"
    parallel: false
    autonomous: true
    steps:
      - id: "INTG-001"
        title: "Integrate execution system with existing skills"
        description: "Connect checklist loop, memory, compaction, and observability to existing SkillWeave skill infrastructure. Ensure backward compatibility."
        type: integration
        estimated_minutes: 45
        priority: high
        depends_on: ["FEAT-001", "FEAT-002", "FEAT-003", "FEAT-004", "FEAT-005", "FEAT-006", "FEAT-007"]
        gates:
          - "Skills can opt into checklist-driven execution via config flag"
          - "Memory layer loadable from any skill"
          - "Observability metrics collected during skill execution"
          - "Existing skill invocations work unchanged (no regressions)"
          - "Execution system is opt-in via config.yaml key"
        autonomous_check:
          validate: "Invoke existing skill without execution config, verify unchanged behavior. Enable config, verify execution hooks fire."
          on_failure: "Wrap integration in try/except guard, log integration failures without crashing skill"

  - phase: "testing"
    parallel: false
    autonomous: true
    steps:
      - id: "TEST-001"
        title: "Comprehensive test suite for execution system"
        description: "Tests for checklist loop, memory, compaction, observability, selective loading, artifact tracking, correction, and integration."
        type: testing
        estimated_minutes: 45
        priority: high
        depends_on: ["INTG-001"]
        gates:
          - "Test file exists with 18+ test cases"
          - "Checklist loop tests pass (read, identify, update, loop, nested, blocker)"
          - "Memory round-trip tests pass (write, read, search, category filter)"
          - "Compaction output validation tests pass (4 sections, loadable)"
          - "Observability metrics tests pass (record, report, cumulative)"
          - "Selective loading tests pass (declared context, default, override)"
          - "Artifact tracking tests pass (3 log types, append, readback)"
          - "Correction tests pass (failure, retry, max-retries escalation)"
          - "Backward compatibility tests pass (existing skills unaffected)"
          - "All tests run without errors"
        autonomous_check:
          validate: "Run full test suite, collect pass/fail per test case, retry failed tests once"
          on_failure: "Report failing tests with error output, attempt fix on failures < 3, escalate if > 3"

final_assembly:
  steps:
    - "Create .skillweave/memory/ directory with 5 category seed files"
    - "Create .skillweave/checklists/ directory with sample checklist"
    - "Create .skillweave/tracking-log/ directory with seed log files"
    - "Update .skillweave/config.yaml with execution system opt-in key"
    - "Verify all Python modules import without errors"
    - "Run sample execution: checklist -> execute -> compact -> report"
    - "Generate execution summary for documentation"

validation_rules:
  - "All YAML format specs are consistent across modules"
  - "Checklist markdown parser handles nesting up to 3 levels"
  - "Memory round-trip: write -> read -> compare equals original"
  - "Metrics are non-negative integers/floats"
  - "Selective loader proves context reduction (measure bytes)"
  - "Correction does not enter infinite loop (enforce max retries)"
  - "Integration does not break any existing skill invocation"
  - "All 18+ tests pass with 0 failures"

failure_handling:
  checklist_corruption:
    action: "Restore from last valid context summary, discard corrupted checklist state"
    max_retries: 3
    autonomous: true
    escalation: "Log corruption details to tracking-log and restart from last known good"
  memory_write_failure:
    action: "Fall back to plain file write (skip YAML serialization, write raw dict dump)"
    max_retries: 2
    autonomous: true
    escalation: "Flag degraded memory mode in config, continue execution"
  compaction_corruption:
    action: "Regenerate summary from last valid checklist and memory state"
    max_retries: 2
    autonomous: true
    escalation: "Save partial summary, flag incomplete, request attention at next checkpoint"
  metrics_rollover:
    action: "Archive current metrics file, start new one, link from execution report"
    max_retries: 1
    autonomous: true
    escalation: "None — archive is silent"
  selective_loader_missing_file:
    action: "Skip missing file with warning, continue with available context"
    max_retries: 0
    autonomous: true
    escalation: "Logged to tracking-log as warning"
  correction_loop_detected:
    action: "Break retry loop after max retries, escalate to human review"
    max_retries: 0
    autonomous: false
    escalation: "Set item status to human_review_required, pause execution, generate escalation report"
  integration_bind_failure:
    action: "Wrap integration hooks in safety guard, disable execution system for failing skill"
    max_retries: 1
    autonomous: true
    escalation: "Report integration failure with traceback, continue with system degraded"
  test_failure:
    action: "Retry failed tests once, apply targeted fix, re-run full suite"
    max_retries: 1
    autonomous: true
    escalation: "If > 3 tests still failing after retry, escalate for human review"
