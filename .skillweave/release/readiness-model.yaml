# SkillWeave Release Readiness Model
# Defines prerequisite checks organized by tier severity.
# Part of Initiative 03 — Release, Launch, and Workflow Rationalization.

model:
  version: 1.0.0
  description: "Release readiness prerequisite model with remediation guidance"

tiers:
  critical:
    description: "Must pass — release is blocked if any critical check fails (unless override flag is set)"
    checks:
      - id: tests-exist
        name: "Test suite exists"
        description: "A test suite exists in the project"
        check_type: file_exists
        target: "tests/"
        remediation: |
          Create a test suite in the `tests/` directory.
          Use `pytest` as the test runner.
          Add at least one test file (e.g., `tests/test_<module>.py`).
        override_allowed: true

      - id: tests-pass
        name: "All tests pass"
        description: "The test suite runs without failures"
        check_type: command
        command: "rtk pytest tests/ -q"
        expected_exit: 0
        remediation: |
          Run `rtk pytest tests/ -v` to see individual failures.
          Fix failing tests before proceeding with release.
          If tests are flaky, mark them explicitly as `@pytest.mark.flaky`.
        override_allowed: true

      - id: version-bumped
        name: "Version has been bumped"
        description: "The project version in pyproject.toml differs from the latest git tag"
        check_type: version_diff
        source: "pyproject.toml"
        target: "latest_git_tag"
        remediation: |
          Update the version in `pyproject.toml` under `[project].version`.
          Run `skillweave-version-bump <part>` (part = major, minor, patch).
          Create a corresponding git tag: `git tag v<new-version>`.
        override_allowed: true

      - id: changelog-updated
        name: "Changelog has been updated"
        description: "Changelog file exists and contains entries for the current version"
        check_type: file_contains
        target: "CHANGELOG.md"
        pattern: "## \\[\\d+\\.\\d+\\.\\d+\\]"
        remediation: |
          Add a new section to CHANGELOG.md:
          ```markdown
          ## [X.Y.Z] - YYYY-MM-DD
          ### Added
          ### Changed
          ### Fixed
          ```
          Use `git log --oneline <last-tag>..HEAD` for reference.
        override_allowed: true

  recommended:
    description: "Should pass — warnings are emitted for failed recommended checks, but release can proceed"
    checks:
      - id: deployment-config
        name: "Deployment configuration exists"
        description: "Deployment config (Dockerfile, deploy script, or CI config) exists for the project"
        check_type: any_file_exists
        targets:
          - "Dockerfile"
          - "deploy.sh"
          - "Dockerfile.*"
          - ".github/workflows/deploy*.yml"
        remediation: |
          Create a deployment configuration for your target platform.
          Common options:
          - Docker: Create a `Dockerfile` at project root
          - GitHub Actions: Create `.github/workflows/deploy.yml`
          - Shell script: Create `deploy.sh` with deployment commands
          Reference: `.skillweave/templates/deployment/` for starter templates.
        override_allowed: false

      - id: ci-passing
        name: "CI pipeline is passing"
        description: "CI configuration exists and last run was successful"
        check_type: ci_status
        platform: "github_actions"
        remediation: |
          Check your CI pipeline status at:
          https://github.com/<owner>/<repo>/actions
          Fix any failing CI jobs before releasing.
          Common issues: lint failures, test timeouts, dependency conflicts.
        override_allowed: false

      - id: dependency-audit
        name: "Dependency audit clean"
        description: "No known vulnerabilities in project dependencies"
        check_type: command
        command: "pip-audit --descri"
        expected_exit: 0
        remediation: |
          Run `pip-audit` to identify vulnerable dependencies.
          Update affected packages: `pip install <package> --upgrade`.
          For critical vulnerabilities that cannot be resolved immediately,
          document the exception in `.skillweave/release/exceptions.yaml`.
        override_allowed: true

  optional:
    description: "Nice to have — informational only, no blocking or warnings"
    checks:
      - id: benchmark-comparison
        name: "Benchmark comparison available"
        description: "Performance benchmarks exist and regressions are documented"
        check_type: file_exists
        target: "docs/benchmarks/"
        remediation: |
          Run existing benchmarks before and after your changes.
          Document any performance regressions in the release notes.
          If no benchmarks exist, consider adding them for critical paths.
        override_allowed: false

      - id: docs-review
        name: "Documentation has been reviewed"
        description: "Documentation has been reviewed for accuracy against the new release"
        check_type: custom
        remediation: |
          Review all public-facing documentation for accuracy:
          - README.md
          - API documentation
          - Migration guides
          - Examples and tutorials
          Update any references to the old version number.
        override_allowed: false

      - id: security-review
        name: "Security review completed"
        description: "Security review of new/changed code has been completed"
        check_type: custom
        remediation: |
          For significant changes, perform a security review:
          - Check for input validation issues
          - Review authentication/authorization changes
          - Check for dependency vulnerabilities
          - Review data handling and privacy
          Document findings in `.skillweave/release/security-review.md`.
        override_allowed: false

release_vs_launch:
  release:
    activities:
      - "Version bump"
      - "Changelog generation and review"
      - "Prerelease validation (tests, CI, audit)"
      - "Build artifact creation"
      - "Git tag creation"
      - "Artifact publishing (PyPI, npm, Docker)"
    responsibility: "releasechain skill"
    entry_condition: "Build phase complete or changes are ready for release"
    exit_condition: "Release artifacts published and git tag created"

  launch:
    activities:
      - "Deployment to production environment"
      - "User-facing communication (release notes, blog posts, changelog)"
      - "Marketing materials preparation"
      - "Go-live coordination"
      - "Launch metrics baseline capture"
    responsibility: "launch skill"
    entry_condition: "Release is published and available (release phase completed)"
    exit_condition: "Deployment complete and verified, user communication sent"
