name: review-profile
tier: balanced
limits:
  timeout: 120.0
  max_retries: 2
  min_models_required: 2
  on_model_failure: skip
roles:
  reviewer:
    model: faigate/deepseek-v4-pro
    tool:
      name: opencode
      launch_command: opencode run --model faigate/deepseek-v4-pro -
    capabilities:
      can_approve_gate: true
  observer:
    observer: true
    capabilities:
      can_observe_run: true
