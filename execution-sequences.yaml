mode: standard
workflow: ralph-loop-attended
checkpoint_interval: 5
description: Ralph Loop execution with human checkpoints for SkillWeave v0.5.5 Intelligent Guidance
phases:
  -
    name: phase_1_risk_mode_override
    tasks:
      - T-001
      - T-002
      - T-003
      - T-004
      - T-005
      - T-006
      - T-007
      - T-008
      - T-009
      - T-010
      - T-011
    depends_on:
    parallel: True
    description: Risk Mode Override System - configuration, CLI, interactive selection
    verification:
      - typecheck
      - lint
      - unit_tests
  -
    name: phase_2_intelligent_detection
    tasks:
      - T-012
      - T-013
      - T-014
      - T-015
      - T-016
      - T-017
      - T-018
      - T-019
      - T-020
      - T-021
      - T-022
      - T-023
      - T-024
    depends_on:
    parallel: True
    description: Intelligent Skill Detection Engine - prompt analysis, mapping, validation
    verification:
      - typecheck
      - lint
      - unit_tests
  -
    name: phase_3_onboarding_flow
    tasks:
      - T-025
      - T-026
      - T-027
      - T-028
      - T-029
      - T-030
    depends_on:
    parallel: True
    description: Onboarding Flow System - interactive guidance, skill switching
    verification:
      - typecheck
      - lint
      - unit_tests
  -
    name: phase_4_integration_testing
    tasks:
      - T-031
      - T-032
      - T-033
      - T-034
      - T-035
    depends_on:
      - phase_1_risk_mode_override
      - phase_2_intelligent_detection
      - phase_3_onboarding_flow
    parallel: True
    description: Integration & Testing - core integration, performance optimization, comprehensive tests
    verification:
      - integration_tests
      - performance_benchmarks
      - system_tests
memory_system:
  short_term: progress-structured.yaml
  long_term: agents-enhanced.md
  update_frequency: per_iteration
verification:
  levels:
    - code
    - functional
    - system
  gates:
    - pre_commit
    - pre_merge
    - pre_deploy