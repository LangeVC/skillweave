# SkillWeave WorkProfile: software-delivery.v2
#
# SW-160-VERT-001. Provider-neutral software delivery lifecycle profile.
#
# Resolves into the generic kernel (K0-K6) and the normal run service
# (RunApplicationService). No product-specific shortcut bypasses contract,
# evidence or review gates.
#
# This file is DATA, loaded through skillweave.routing.harness.load_profiles_from_location.
# It carries both the WorkProfile contract fields (contractVersion, id, category,
# kernelStages, topology, etc.) and the RoutingProfile fields (name, tier, limits,
# roles) so it can be consumed by either path.
#
# Adapt before use: the launch command assumes `opencode` is on PATH, and the
# model id is the one this profile was proven against. Both are yours to change.

# WorkProfile contract fields
contractVersion: "1.0.0"
id: software-delivery.v2
title: "Software Delivery V2"
category: build
kernelStages:
  - K0
  - K1
  - K2
  - K3
  - K4
  - K5
  - K6
topology: iterative
humanCoupling: supervised
changeSurfaces:
  - code
  - configuration
  - infrastructure
  - documents
deliverables:
  - prd
  - architecture
  - implementation
  - tests
  - release-notes
evidence:
  - test-results
  - review-attestation
  - build-artifact

# RoutingProfile fields
name: software-delivery-v2
tier: balanced
limits:
  timeout: 120.0
  max_retries: 2
  min_models_required: 2
  on_model_failure: skip
roles:
  observer:
    observer: true
    capabilities:
      can_observe_run: true
  ops:
    model: faigate/deepseek-v4-pro
    tool:
      name: opencode
      launch_command: opencode run --model faigate/deepseek-v4-pro -
    capabilities:
      can_mutate_run_state: true
  reviewer:
    model: faigate/deepseek-v4-pro
    tool:
      name: opencode
      launch_command: opencode run --model faigate/deepseek-v4-pro -
    capabilities:
      can_approve_gate: true
