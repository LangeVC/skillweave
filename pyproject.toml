[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skillweave"
version = "0.8.1"
description = "Multi-agent AI skill orchestration with Next Level features"
readme = "README.md"
authors = [
    {name = "SkillWeave Team"},
]
license = {text = "Apache-2.0"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "flake8>=6.0",
]

[project.urls]
Homepage = "https://github.com/typelicious/SkillWeave"
Repository = "https://github.com/typelicious/SkillWeave"
Issues = "https://github.com/typelicious/SkillWeave/issues"

[project.scripts]
skillweave-install = "skillweave.installer:main"
skillweave-risk-mode = "skillweave.scripts.resolve_risk_mode:main"
skillweave-interactive-mode = "skillweave.scripts.interactive_mode:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["skillweave*"]

[tool.setuptools.package-data]
skillweave = ["py.typed"]
