# Assumption Log — Risk-Scored and Categorized
# Template for tracking assumptions with validation status.
# Fields: id, category, description, impact, probability, risk_score,
#         zone, evidence_level, status, validation_method, notes

assumptions:
  - id: "assumption-001"
    category: "user"
    description: "{{assumption_description}}"
    source: "{{source}}"
    stated_as_fact: "{{stated_as_fact}}"
    impact: "{{impact_score}}"
    probability: "{{probability_score}}"
    risk_score: "{{risk_score}}"
    zone: "{{risk_zone}}"  # high / medium / low
    evidence_level: "{{evidence_level}}"  # none / anecdotal / correlational / causal
    certainty: "{{certainty}}"  # high / medium / low
    status: "unvalidated"  # unvalidated / validated / invalidated / in_progress
    validation_method: "{{validation_method}}"
    validation_criterion: "{{validation_criterion}}"
    validated_date: null
    notes: "{{notes}}"
    contingency: "{{contingency}}"
    owner: "{{owner}}"
    created: "{{date}}"

