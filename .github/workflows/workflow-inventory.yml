name: Workflow Inventory

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    name: Generate Workflow Inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML

      - name: Run workflow inventory
        id: inventory
        run: |
          python3 -c "
          import sys, json
          sys.path.insert(0, 'src')
          from skillweave.github_integration.inventory import WorkflowInventory
          inventory = WorkflowInventory()
          result = inventory.inventory()
          print(json.dumps({
              'total_workflows': result.total_workflows,
              'trigger_summary': result.trigger_summary,
              'errors': result.errors,
              'workflows': [
                  {'filename': w.filename, 'name': w.name, 'triggers': w.triggers}
                  for w in result.workflows
              ],
          }, indent=2))
          "

      - name: Generate markdown inventory
        run: |
          python3 -c "
          import sys
          sys.path.insert(0, 'src')
          from skillweave.github_integration.inventory import WorkflowInventory
          inventory = WorkflowInventory()
          result = inventory.inventory()
          markdown = inventory.generate_markdown(result)
          with open('workflow-inventory.md', 'w') as f:
              f.write(markdown)
          print('Inventory written to workflow-inventory.md')
          "

      - name: Upload inventory artifact
        uses: actions/upload-artifact@v4
        with:
          name: workflow-inventory
          path: workflow-inventory.md
