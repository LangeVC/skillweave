name: Release Distribution Assets

# SW1312-RELEASE-PROVENANCE-001 — distribution assets only.
#
# The release object is created on Forgejo by the ops-engine ReleaseHandler;
# the mirror force-pushes the tag here. This workflow runs on the GitHub side
# after mirror input and publishes distribution assets that the Linux Forgejo
# host cannot build (the one named exception). It never creates or moves a tag,
# never creates a release object, and never publishes from an unverified branch.
#
# PyPI: removed. There is no operator-approved PyPI product and no credentialed
# PyPI release contract, so no workflow publishes to PyPI and no documentation
# makes a PyPI claim.
#
# Capacium: published by release-on-tag.yml keyed to the verified tag, not here.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  update-homebrew:
    name: Update Homebrew Tap Formula
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Homebrew tap update for the released tag
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tagName = context.payload.release.tag_name;
            const releaseName = context.payload.release.name;
            if (!releaseName || !releaseName.match(/^SkillWeave v\d+\.\d+\.\d+$/)) {
              core.warn("Skipping Homebrew update — naming convention mismatch");
              return;
            }
            const version = tagName.replace(/^v/, '');
            core.notice(`Ready for Homebrew update: ${repo} v${version}`);
