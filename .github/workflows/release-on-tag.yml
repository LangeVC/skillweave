name: Release on Tag

# SW-CI-003: a tag push triggers something. Until now release.yml and
# auto-release-notes.yml hang off `on: release` (release OBJECT), nothing on
# `tags:`. A v*-tag mirrored from Forgejo lands here and creates the release
# object — without anyone having to click it by hand on GitHub.
#
# The tag has already passed validate-release-tag.yml on the canonical side
# (Forgejo). Here it is trusted: it is NOT re-checked against the 13 member
# manifests — that would be the error SW-CI-002-G fixed (member versions are
# not locations of the bundle release line). Only the naming convention CI
# (auto-tag-release.yml) and the releasechain skill already require is checked
# here.
#
# github.server_url guard: runs only on GitHub, never on the Forgejo runner.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  RELEASE_NAME_PREFIX: "SkillWeave"

jobs:
  release:
    name: Create GitHub Release
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce naming convention (SkillWeave vX.Y.Z)
        run: |
          TAG="${GITHUB_REF_NAME}"
          NAME="${RELEASE_NAME_PREFIX} ${TAG}"
          if ! echo "${NAME}" | grep -qE '^SkillWeave v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "HARD GATE REJECTED — '${NAME}' does not match ^SkillWeave vX.Y.Z$"
            exit 1
          fi
          echo "${NAME}" > release-name.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ env.RELEASE_NAME_PREFIX }} ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
