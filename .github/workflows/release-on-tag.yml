name: Release Distribution on Tag

# SW1312-RELEASE-PROVENANCE-001 — distribution only, no release object.
#
# Forgejo is canonical. The ops-engine ReleaseHandler creates the release object
# on Forgejo on tag_push; the mirror force-pushes the tag ref here. This workflow
# runs on the GitHub side after mirror input and is DISTRIBUTION ONLY: it
# publishes to the Capacium exchange for the verified, immutable release/tag.
# It does NOT create a release object, does NOT create or move a tag, and does
# NOT publish from an unverified branch — the tag it reacts to already passed
# the canonical Forgejo gate (validate-release-tag.yml) before the mirror pushed
# it here.
#
# Capacium publication is therefore keyed to the verified immutable release/tag
# path, never to a GitHub-created release object.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish-capacium:
    name: Publish to Capacium Exchange
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on the committed default branch (no unverified branch)
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # The tag must be an ancestor of origin's default branch so a stray
          # tag pushed to a side branch cannot publish. Default branch is
          # determined, never assumed (mirror model reads it at run time).
          # Guarded form (SW152-002): on a fresh actions/checkout there is no
          # origin/HEAD symref, so `git symbolic-ref` exits 128 and would kill
          # the gate before its ancestor check ever runs. Fall back to the
          # remote's declared HEAD, then to a fail-closed "main" (a wrong guess
          # yields an empty merge-base -> rejected, never a bypass).
          DEFAULT_BRANCH="$(git symbolic-ref refs/remotes/origin/HEAD 2>/dev/null | sed 's#^refs/remotes/origin/##' || true)"
          if [ -z "${DEFAULT_BRANCH}" ]; then
            DEFAULT_BRANCH="$(git ls-remote --symref origin HEAD 2>/dev/null | sed -n '1s/^ref: refs\/heads\/\([^[:space:]]*\).*/\1/p' || true)"
          fi
          if [ -z "${DEFAULT_BRANCH}" ]; then
            DEFAULT_BRANCH="main"
          fi
          echo "default branch: ${DEFAULT_BRANCH}"
          # Ensure the default-branch tip is a local ref before merge-base
          # (the checkout only fetched the triggering tag ref).
          git fetch --no-tags --force origin "refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}" >/dev/null 2>&1 || true
          if ! git merge-base --is-ancestor "${TAG}" "refs/remotes/origin/${DEFAULT_BRANCH}"; then
            echo "HARD GATE REJECTED — tag ${TAG} is not on the default branch"
            exit 1
          fi
          echo "Tag ${TAG} is on the default branch ${DEFAULT_BRANCH}."

      - name: Publish to Capacium
        uses: Capacium/capacium-action-publish@v1
        with:
          github_url: ${{ github.event.repository.html_url }}
