name: Cross-Repo Contract CI

# Wächter des skillweave-Kerns gegen den gepinnten skillweave-sdk-Vertrag.
#
# Pull, nicht Push (§C.2 im docs/repo-vierteilung-contract.md): dieser Job liest
# .contract/consumer.toml, lädt genau die gepinnte SDK-Version und vergleicht
# die Wertemengen. Wird ein Contract im SDK gebrochen, wird DIESER Build rot —
# das ist die Nachweispflicht von GLE-004.
#
# Die SDK-Quelle ist AUSSCHLIESSLICH das gepinnte Artefakt (Tag v<pin>), das
# dieser Job klont. Keine eingecheckte sdk/-Kopie im Core, keine doppelte
# Wahrheit (§C.2). Der Klon setzt SKILLWEAVE_SDK_DIR; der Waechter verifiziert
# den Cache gegen den Pin.

on:
  push:
    branches: ["**"]
    paths:
      - ".contract/**"
      - "scripts/contract/**"
      - "src/skillweave/runtime/store.py"
  pull_request:
  # SDK-Dispatcher (§C.8): der Consumer pollt deterministisch, weil er nicht
  # weiss, wann das SDK sich aendert. Der Schedule garantiert den Lauf; der
  # workflow_dispatch erlaubt den sofortigen Bruch-Beweis.
  schedule:
    - cron: "37 3 * * *"   # taeglich 03:37 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-run-state:
    name: Contract — run-state vocabulary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkout gepinntes SDK-Artefakt
        env:
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
        run: |
          PIN=$(python3 -c "import tomllib; print(tomllib.load(open('.contract/consumer.toml','rb'))['sdk']['version'])")
          TAG="v${PIN}"
          echo "PIN=$PIN TAG=$TAG"
          git clone --depth 1 --branch "$TAG" "https://github.com/LangeVC/skillweave-sdk.git" /tmp/skillweave-sdk || \
            git clone --depth 1 --branch "$TAG" "https://x-access-token:${GH_MIRROR_TOKEN}@github.com/LangeVC/skillweave-sdk.git" /tmp/skillweave-sdk
          echo "SKILLWEAVE_SDK_DIR=/tmp/skillweave-sdk" >> "$GITHUB_ENV"

      - name: Run contract CI (run-state)
        run: python3 scripts/contract/contract_ci.py

      # Bewusst KEIN pytest-Schritt hier: der Unit-Test (test_vocabulary_guard)
      # nutzt den Import-Leser (from skillweave... import RunStateModel), der
      # die vollen Core-Deps braucht. Dieser Job ist die Schlanke Cross-Repo-
      # Ebene und laeuft importfrei (AST). Der Import-basierte Unit-Test ist
      # das lokale Gegenleser-Merkmal und laeuft in der regulären Test-Suite
      # mit installierten Deps. Zwei Leser, verschiedene Ebenen (§C.2).
