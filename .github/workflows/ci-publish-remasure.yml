name: CI Publish Re-measure

# SW-CI-001-R — re-measure the existing CI/publish checks against the current
# pyproject version (1.3.6) and record the result as a workflow artifact, not a
# code claim. The check set is the same set the release path already runs; this
# workflow only measures and cuts the stale remainder out into a digest.
#
# Each check is executed for real in the runner shell and its pass/fail is
# written to ci-remasure-<version>.json. A check that fails here is a measured
# fact (e.g. member skill manifests carrying their own 1.3.0 version line versus
# the 1.3.6 bundle), not a silent assertion.
on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "capability.yaml"
      - "skills/**/capability.yaml"
      - "scripts/*.py"
      - ".github/workflows/ci-publish-remasure.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remeasure:
    name: Re-measure release checks against current version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install PyYAML pytest

      - name: Re-measure publish checks
        id: measure
        env:
          PYTHONPATH: src
        run: |
          python3 - <<'PY'
          import json
          import re
          import subprocess
          import sys
          from pathlib import Path

          def version():
              return re.search(
                  r'^version\s*=\s*["\']([^"\']+)["\']',
                  Path("pyproject.toml").read_text(),
                  re.MULTILINE,
              ).group(1)

          VERSION = version()
          checks = []

          def run(name, cmd):
              r = subprocess.run(cmd, shell=True, capture_output=True, text=True)
              checks.append({
                  "check": name,
                  "passed": r.returncode == 0,
                  "exit": r.returncode,
                  "output": (r.stdout + r.stderr).strip().splitlines()[-3:],
              })
              print(f"[{'PASS' if r.returncode == 0 else 'FAIL'}] {name} (exit {r.returncode})")

          # The same publish/release checks the release path runs, re-measured
          # against the current version instead of a hardcoded baseline.
          run("version-source-of-truth", f"python3 -c \"import re,pathlib; m=re.search(r'^version\\\\s*=\\\\s*\\\"([^\\\"]+)\\\"', pathlib.Path('pyproject.toml').read_text(), re.MULTILINE); print(m.group(1))\"")
          run("capacium-manifests-sync", "python3 scripts/sync-capacium-manifests.py --check")
          run("manifest-vs-member-files", "python3 scripts/check-manifest.py --repo .")
          run("github-integration-tests", "python3 -m pytest tests/test_github_integration.py -q -p no:cacheprovider")
          run("release-readiness-gate", f"RELEASE_VERSION={VERSION} python3 -c 'from skillweave.github_integration.release_gate import run_cli; run_cli()'")

          passed = sum(1 for c in checks if c["passed"])
          result = {
              "version": VERSION,
              "passed": passed,
              "total": len(checks),
              "checks": checks,
          }
          Path("ci-remasure.json").write_text(json.dumps(result, indent=2))
          print(f"ci-remasure: {passed}/{len(checks)} checks passed for {VERSION}")
          PY

      - name: Upload re-measurement artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-remasure
          path: ci-remasure.json
