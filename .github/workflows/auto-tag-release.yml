name: Auto Tag and Release

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      force_tag:
        description: "Force tag version (e.g. 0.6.0)"
        required: false
        type: string

permissions:
  contents: write

env:
  # RELEASE NAMING CONVENTION
  # All release names MUST follow the pattern: "SkillWeave v{major}.{minor}.{patch}"
  # Examples: SkillWeave v0.6.0, SkillWeave v1.0.0, SkillWeave v0.7.1
  # This is enforced in the create-release job below.
  RELEASE_NAME_PREFIX: "SkillWeave"

jobs:
  analyze-version:
    name: Analyze Version Change
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.analyze.outputs.should_release }}
      current_version: ${{ steps.analyze.outputs.current_version }}
      tag: ${{ steps.analyze.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install PyYAML

      - name: Analyze version
        id: analyze
        run: |
          python3 -c "
          import sys, subprocess, json
          sys.path.insert(0, 'src')
          from skillweave.github_integration.autotag import AutoTagger

          tagger = AutoTagger()

          existing_tags = []
          try:
              result = subprocess.run(
                  ['git', 'tag', '--list', 'v*'],
                  capture_output=True, text=True, timeout=30
              )
              existing_tags = result.stdout.strip().split('\n') if result.stdout.strip() else []
          except Exception:
              pass

          result = tagger.analyze(existing_tags)
          print(f'should_release={str(result.should_release).lower()}')
          print(f'current_version={result.current_version}')
          if result.candidates:
              print(f'tag={result.candidates[0].tag}')
          "

      - name: Log version analysis
        run: |
          SHOULD_RELEASE="${{ steps.analyze.outputs.should_release }}"
          echo "Version analysis complete."
          echo "Should release: $SHOULD_RELEASE"
          echo "Current version: ${{ steps.analyze.outputs.current_version }}"
          echo "Tag: ${{ steps.analyze.outputs.tag }}"

  create-tag:
    name: Create Git Tag
    needs: [analyze-version]
    if: needs.analyze-version.outputs.should_release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine tag
        id: set-tag
        run: |
          if [ "${{ github.event.inputs.force_tag }}" != "" ]; then
            TAG="v${{ github.event.inputs.force_tag }}"
          else
            TAG="${{ needs.analyze-version.outputs.tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Will create tag: $TAG"

      - name: Create tag
        run: |
          TAG="${{ steps.set-tag.outputs.tag }}"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "Tag $TAG created and pushed."

  create-release:
    name: Create GitHub Release
    needs: [analyze-version, create-tag]
    if: always() && needs.create-tag.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate release notes
        id: notes
        run: |
          TAG="${{ needs.create-tag.outputs.tag }}"
          python3 -c "
          import sys
          sys.path.insert(0, 'src')
          from skillweave.github_integration.release_notes import ReleaseNotesGenerator
          gen = ReleaseNotesGenerator()
          notes = gen.generate(version='$TAG')
          print(notes)
          " > release_notes.md

      - name: Validate release name convention
        run: |
          RELEASE_NAME="${{ env.RELEASE_NAME_PREFIX }} ${{ needs.create-tag.outputs.tag }}"
          echo "Release name: $RELEASE_NAME"
          if ! echo "$RELEASE_NAME" | grep -qE '^SkillWeave v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: Release name '$RELEASE_NAME' does not follow convention."
            echo "Convention: SkillWeave v{major}.{minor}.{patch} (e.g. SkillWeave v0.6.0)"
            exit 1
          fi
          echo "Release name follows convention: $RELEASE_NAME"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-tag.outputs.tag }}
          name: ${{ env.RELEASE_NAME_PREFIX }} ${{ needs.create-tag.outputs.tag }}
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
