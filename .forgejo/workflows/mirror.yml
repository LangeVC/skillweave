name: Mirror to GitHub

# Forgejo is canonical; GitHub (LangeVC/skillweave) is the public read-only
# mirror. Force-push exactly the ref that triggered the run, so GitHub follows
# Forgejo.
#
# Pattern: exact-ref, agreed 2026-07-28 under LVC-MIR-G0 for the langevc org.
# Until now this repo ran the old main-plus-bulk-tags pattern, explicitly
# replaced there.
on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref to mirror again, e.g. refs/tags/v2.3.0'
        required: true
        type: string

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to GitHub mirror
        env:
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          MIRROR_REF: ${{ inputs.ref || github.ref }}
        run: |
          remote="https://x-access-token:${GH_MIRROR_TOKEN}@github.com/LangeVC/skillweave.git"
          # Mirror only the triggering ref. No --prune, no 'refs/heads/*'
          # wildcard: the CI checkout has only that one ref locally, so a pruning
          # wildcard push would want to delete every OTHER branch on the mirror —
          # including GitHub's default branch (which GitHub rejects, failing the
          # job) and any GitHub-managed branch like gh-pages.
          git push --force "$remote" "+${MIRROR_REF}:${MIRROR_REF}"
