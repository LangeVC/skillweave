name: Mirror to GitHub

# Forgejo ist kanonisch; GitHub (LangeVC/skillweave) ist der oeffentliche
# read-only Mirror. Force-Push genau der Ref, die den Lauf ausgeloest hat,
# damit GitHub Forgejo folgt.
#
# Muster: exact-ref, festgelegt am 2026-07-28 unter LVC-MIR-G0 fuer die
# langevc-Org. Dieses Repo lief bis heute auf dem alten main-plus-Bulk-Tags-
# Muster, das dort ausdruecklich ersetzt wurde.
on:
  push:
    branches: ["**"]
    tags: ["v*"]

  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref zum Nachspiegeln, z.B. refs/tags/v2.3.0'
        required: true
        type: string

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to GitHub mirror
        env:
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          MIRROR_REF: ${{ inputs.ref || github.ref }}
        run: |
          remote="https://x-access-token:${GH_MIRROR_TOKEN}@github.com/LangeVC/skillweave.git"
          # Nur die ausloesende Ref spiegeln. Kein --prune, kein
          # 'refs/heads/*'-Wildcard: Der CI-Checkout hat lokal nur diese eine
          # Ref, ein prunender Wildcard-Push wuerde jeden ANDEREN Branch auf
          # dem Mirror loeschen wollen — einschliesslich GitHubs Default-Branch
          # (was GitHub ablehnt und den Job scheitern laesst) und jeden von
          # GitHub verwalteten Branch wie gh-pages.
          git push --force "$remote" "+${MIRROR_REF}:${MIRROR_REF}"
