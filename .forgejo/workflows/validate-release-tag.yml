name: Release Tag Validate

# Forgejo-seitiges Gate vor der Spiegelung eines v*-Tags (SW-CI-002-G).
#
# Ein Tag allein darf nicht nach GitHub durchschlagen, bevor nicht belegt ist,
# dass (a) alle Versionsorte der BUNDLE-Linie mit source_of_truth uebereinstimmen,
# und (b) der Tag selbst dem Versionsort entspricht (der CAP-CI-001-Fall: ein
# v0.17.0-Tag, der auf einen Commit zeigt, dessen source_of_truth noch 0.16.0
# sagt — `check` vergleicht Orte untereinander, dieser Drift faellt erst beim
# Tag-Vergleich auf).
#
# version-sync.py wird hier NICHT vendort (PRD SW-CI-002-G). Es ist kanonisch in
# ops-engine (OSS, oeffentlich gespiegelt) und wird zur Laufzeit beschafft; `check-tag` liest dieselbe .version.yaml wie das Bump-Werkzeug.
#
# Der capabilities:-Block der Bundle-capability.yaml ist ein MANIFEST, kein
# Versionsort (Fall 4). Den prueft das eigenstaendige check-manifest.py — ohne
# jeden Bezug auf source_of_truth. Abweichende Mitgliedsversionen sind erlaubt;
# verboten ist nur, dass Manifest und Mitgliedsdatei sich widersprechen.
on:
  push:
    tags:
      - 'v*'

jobs:
  validate:
    name: Validate tag against .version.yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch version-sync.py (canonical, ops-engine)
        run: |
          # Generic tooling lives in the open base (LVC-221). ops-engine is
          # OSS and publicly mirrored, so this needs no credential and works
          # identically from every org — the private lvc-ops URL did not.
          curl -fsSL \
            "https://raw.githubusercontent.com/LangeVC/ops-engine/master/scripts/version-sync.py" \
            -o "$RUNNER_TEMP/version-sync.py"

          # Prove what arrived. Without this the step reports success even
          # when it fetched an HTML login page: a private raw URL answers 303
          # to /user/login, curl -L follows, the login page returns 200, and
          # -f never triggers. That is how the first live run of this gate
          # died three steps later on "SyntaxError: <!DOCTYPE html>".
          python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" \
            "$RUNNER_TEMP/version-sync.py" \
            || { echo "fetched file is not Python — first three lines:"; \
                 head -3 "$RUNNER_TEMP/version-sync.py"; exit 1; }

          echo "VERSION_SYNC=$RUNNER_TEMP/version-sync.py" >> "$GITHUB_ENV"

      - name: Gate — locations (a/b) and tag == source_of_truth (c)
        run: |
          # check-tag vergleicht den Tag gegen source_of_truth OHNE v-Praefix.
          python3 "$VERSION_SYNC" check-tag "${GITHUB_REF_NAME#v}" --repo .

      - name: Gate — capabilities manifest == member files (case 4)
        run: |
          python3 scripts/check-manifest.py --repo .

  mirror:
    name: Mirror to GitHub
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to GitHub mirror
        env:
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          MIRROR_REF: ${{ github.ref }}
        run: |
          remote="https://x-access-token:${GH_MIRROR_TOKEN}@github.com/LangeVC/skillweave.git"
          git push --force "$remote" "+${MIRROR_REF}:${MIRROR_REF}"
