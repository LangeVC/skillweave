# .version.yaml — declares the version locations of the BUNDLE release line.
schema: 1

# The truth source of the bundle release line. pyproject.toml carries the one
# version the bump uses as reference and the gate follows.
source_of_truth: pyproject.toml

# CHANGELOG.md carries 1.3.0 in a heading ("## 1.3.0 — ..."). A regex bump
# would rewrite history there. Prose history is not a version location of this
# release line; it is not auto-maintained and is therefore NOT in the list.
# (Decision following the readme.txt pattern from elementeer-mcp: silently
# omitting does not hold, so it is recorded here.)
locations:
  - path: pyproject.toml
    pattern: '^version\s*=\s*"(\d+\.\d+\.\d+)"'
    required: true
  - path: capability.yaml
    pattern: '^version:\s*(\S+)'
    required: true
